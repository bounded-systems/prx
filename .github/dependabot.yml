# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Three ecosystems present in this repo:
#   - bun            -> root package.json + workspace members (packages/*), bun.lock
#   - docker         -> ./Dockerfile
#   - github-actions -> .github/workflows/* (actions are SHA-pinned; keep them current)
version: 2
updates:
  # Bun / npm dependencies. Pointed at the workspace root: Dependabot resolves
  # the `workspaces` field and updates child packages/* manifests from here.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch low-risk bumps into one PR.
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Batch majors into a single PR too; breaking changes still land
      # together for one focused review rather than N noisy PRs.
      bun-major:
        patterns: ["*"]
        update-types: ["major"]

  # Container base image(s) in the root Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]

  # GitHub Actions used in workflows (kept SHA-pinned for supply-chain hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch routine action bumps; major bumps open individually so a
      # potentially CI-breaking upgrade gets its own review.
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
