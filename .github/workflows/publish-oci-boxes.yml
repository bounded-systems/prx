  # Auto-repin: after the boxes rebuild+push (e.g. on a release tag), bump each
  # room's `<box>@sha256:…` to the freshly-built digest and open a PR. Removes the
  # manual repin hop (prx-hfgg). Mints the prx-forge App token so the PR opens
  # ("Actions can't create PRs"). Skipped on dry runs (nothing was pushed).
  repin:
    name: repin room images
    needs: [beadsd-box, forge-d-box, dolt-box]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Serialize the repin: two runs racing here (tag push + a manual dispatch)
    # could both find no open PR and both create one. Queue, never cancel — a
    # cancelled run would leave the branch pushed with no PR opened.
    concurrency:
      group: auto-repin
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.PRX_FORGE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.1.4
        with:
          app-id: ${{ vars.PRX_FORGE_APP_ID }}
          private-key: ${{ secrets.PRX_FORGE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Install skopeo
        run: sudo apt-get install -y skopeo
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Repin room images to freshly-built digests
        run: bun run packages/prx/scripts/repin-boxes.ts
      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet packages/prx/src/room/; then
            echo "room digests already current — nothing to repin"
            exit 0
          fi
          # One fixed branch, force-pushed, and the open PR reused (prx#1062).
          # The branch used to be SHA-derived, so every run minted a new branch
          # and `gh pr create` opened a new PR — seven piled up before the
          # .github-private#516 sweep closed six of them.
          branch="auto-repin"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add packages/prx/src/room/ .changeset/auto-repin.md
          git commit -m "chore(room): auto-repin box images to freshly-built digests"
          # --force-with-lease needs a remote-tracking ref to lease against, and
          # checkout fetched only the triggering ref (depth 1) — so fetch the
          # branch and lease against the tip we actually saw. A fetch failure
          # means it is not on the remote (first run, or deleted when the last
          # repin PR merged), which is the one case a plain push is correct.
          if git fetch --no-tags --depth=1 origin \
            "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
            git push \
              --force-with-lease="refs/heads/${branch}:$(git rev-parse "refs/remotes/origin/${branch}")" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          # The force-push already updated any open PR on this branch, so create
          # one only when none is open. A previously *closed* repin PR does not
          # block creation — GitHub allows a fresh PR from the same head.
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "updated existing repin PR #${existing} — force-pushed ${branch}"
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "chore(room): auto-repin box images to freshly-built digests" \
            --body "Auto-generated by publish-oci-boxes (repin job): bumps each room's pinned \`<box>@sha256:…\` to the digest just built + pushed. Removes the manual repin hop (prx-hfgg / prx-zee7).

          This PR is reused across runs: the \`auto-repin\` branch is force-pushed with the latest digests instead of a new PR being opened each time (prx#1062)."
