name: release-binary

# On a semver tag (e.g. v0.1.0), build the self-contained prx / prx-tui binaries
# per platform and attach them to the GitHub Release. Consumers (e.g. ai-home)
# fetch the asset via nix `pkgs.fetchurl` (hermetic) — no source build needed.
# Library npm publishing (semver) is handled separately by release.yml + changesets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-darwin
          - os: ubuntu-latest
            target: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build prx
        run: |
          PRX_COMPILE_GIT_SHA="$(git rev-parse --short=12 HEAD)" \
          PRX_COMPILE_VERSION="${{ github.ref_name }}" \
          BUN="$(which bun)" \
            bun packages/prx/scripts/prx-compile.ts ./prx-${{ matrix.target }}
      - name: Build prx-tui
        run: |
          bun build --compile \
            --define __PRX_BUILD_GIT_SHA__="\"$(git rev-parse --short=12 HEAD)\"" \
            packages/prx/scripts/prx_tui.ts --outfile ./prx-tui-${{ matrix.target }}
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            prx-${{ matrix.target }}
            prx-tui-${{ matrix.target }}

  # Publish the prx CLI as a container image to GHCR (ghcr.io/<owner>/prx).
  # Multi-stage Dockerfile compiles with bun, then ships a slim runtime.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  # After the binaries are uploaded, compute their sha256 and open a PR updating
  # release-hashes.json (consumed by the flake packages + home-manager module).
  # Tag-only: GITHUB_REF_NAME is the version tag here.
  update-hashes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Compute hashes → release-hashes.json + Homebrew formula
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          json=$(jq -n --arg v "$ver" '{version:$v, systems:{}}')
          for sys in aarch64-darwin x86_64-linux; do
            for name in prx prx-tui; do
              h=$(nix-prefetch-url "$base/$name-$sys")
              json=$(printf '%s' "$json" | jq --arg s "$sys" --arg n "$name" --arg h "$h" '.systems[$s][$n]=$h')
            done
          done
          printf '%s\n' "$json" | jq . > release-hashes.json
          cat release-hashes.json
          # Homebrew formula needs hex sha256 (nix stores base32) — convert.
          d_hex=$(nix hash convert --hash-algo sha256 --to base16 "$(jq -r '.systems."aarch64-darwin".prx' release-hashes.json)")
          l_hex=$(nix hash convert --hash-algo sha256 --to base16 "$(jq -r '.systems."x86_64-linux".prx' release-hashes.json)")
          mkdir -p Formula
          cat > Formula/prx.rb <<RUBY
          # Homebrew formula for prx. This repo doubles as a tap:
          #   brew tap bounded-systems/prx https://github.com/bounded-systems/prx
          #   brew install prx
          # Auto-maintained by .github/workflows/release-binary.yml (update-hashes job).
          class Prx < Formula
            desc "Agent-run PR contract / work-unit CLI"
            homepage "https://github.com/bounded-systems/prx"
            version "$ver"

            on_macos do
              on_arm do
                url "https://github.com/bounded-systems/prx/releases/download/v$ver/prx-aarch64-darwin"
                sha256 "$d_hex"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/bounded-systems/prx/releases/download/v$ver/prx-x86_64-linux"
                sha256 "$l_hex"
              end
            end

            def install
              bin.install Dir["prx-*"].first => "prx"
            end

            test do
              assert_match(/git-/, shell_output("#{bin}/prx --version"))
            end
          end
          RUBY
          cat Formula/prx.rb
      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet release-hashes.json Formula/prx.rb; then
            echo "release-hashes.json + formula already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release-hashes-${GITHUB_REF_NAME}"
          git checkout -b "$branch"
          git add release-hashes.json Formula/prx.rb
          git commit -m "chore: release-hashes + brew formula for ${GITHUB_REF_NAME}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: release-hashes + brew formula for ${GITHUB_REF_NAME}" \
            --body "Auto-generated: sha256 of the ${GITHUB_REF_NAME} release assets, consumed by the flake packages, \`homeManagerModules.prx\`, and the Homebrew formula."
