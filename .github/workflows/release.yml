name: release

# Publishing pipeline for the public per-module split (Track C / M0), proven on
# the @bounded-systems/cas leaf. Separate from ci.yml on purpose: CI stays the
# hard merge gate; this only publishes already-merged, already-green commits.
#
# Flow (changesets, no third-party action so every step is SHA-pinnable):
#   PR with a changeset merges to main -> this runs -> `changeset publish`
#   publishes any package whose version is not yet on npm and pushes its git tag.
# `changeset publish` is idempotent: nothing to publish is a no-op.
#
# Auth: npm **trusted publishing (OIDC)** — no long-lived NPM_TOKEN. The
# `id-token: write` permission below lets npm exchange a short-lived GitHub OIDC
# token for publish rights, provided a Trusted Publisher is configured for each
# package on npmjs.com (org/repo = bounded-systems/prx, workflow = release.yml).
# Provenance (SLSA attestation) is automatic under OIDC.
#
# Gate: publishing is a no-op until the repo variable `NPM_PUBLISH` is `true`.
# This keeps the workflow green before the npm-side Trusted Publisher exists;
# flip the variable once it's configured. (Set via: gh variable set NPM_PUBLISH
# --body true --repo bounded-systems/prx)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changeset publish pushes version tags
      id-token: write # npm trusted publishing (OIDC) + SLSA provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build cas
        run: bun run --filter '@bounded-systems/cas' build

      - name: Publish gate — cas stands alone
        # The "safe to publish" invariant: outward-only deps + no ambient
        # authority. Must pass standalone before anything leaves the repo.
        run: bun test packages/cas/src/__tests__/extractability.test.ts packages/cas/src/__tests__/digest.test.ts

      - name: Ensure npm supports OIDC trusted publishing
        # `changeset publish` shells out to the system `npm`; OIDC trusted
        # publishing needs npm >= 11.5.1. The runner's bundled npm may be older.
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC trusted publishing)
        # No NPM_TOKEN: npm exchanges the GitHub OIDC token (id-token: write) for
        # publish rights via the package's configured Trusted Publisher.
        # Provenance is minted automatically under OIDC (publishConfig.provenance).
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish skipped (NPM_PUBLISH not enabled)
        if: ${{ vars.NPM_PUBLISH != 'true' }}
        run: echo "::notice::NPM_PUBLISH variable not 'true' — built + gated @bounded-systems/cas but skipped npm publish. Configure a Trusted Publisher on npmjs.com, then set the NPM_PUBLISH repo variable to enable OIDC publishing."
