name: release

# Publishing pipeline for the public per-module split (Track C / M0), proven on
# the @bounded-systems/cas leaf. Separate from ci.yml on purpose: CI stays the
# hard merge gate; this only publishes already-merged, already-green commits.
#
# Flow (changesets, no third-party action so every step is SHA-pinnable):
#   PR with a changeset merges to main -> this runs -> `changeset publish`
#   publishes any package whose version is not yet on npm and pushes its git tag.
# `changeset publish` is idempotent: nothing to publish is a no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changeset publish pushes version tags
      id-token: write # npm provenance (SLSA build provenance attestation)
    env:
      # Job-level so the publish steps can gate on its presence (step-level env
      # is not visible to a step's own `if:`). Until NPM_TOKEN is configured,
      # the build + standalone gate still run, but publishing is skipped — so
      # this workflow is green without a token and starts publishing once it's set.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build cas
        run: bun run --filter '@bounded-systems/cas' build

      - name: Publish gate — cas stands alone
        # The "safe to publish" invariant: outward-only deps + no ambient
        # authority. Must pass standalone before anything leaves the repo.
        run: bun test packages/cas/src/__tests__/extractability.test.ts packages/cas/src/__tests__/digest.test.ts

      - name: Configure npm auth
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"

      - name: Publish to npm
        # Provenance is carried by each package's publishConfig.provenance; the
        # id-token: write permission above lets npm mint the SLSA attestation.
        # Skipped when NPM_TOKEN is unset (no creds → nothing to publish yet).
        if: ${{ env.NPM_TOKEN != '' }}
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish skipped (no NPM_TOKEN)
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::notice::NPM_TOKEN not set — built + gated @bounded-systems/cas but skipped npm publish. Set the NPM_TOKEN secret to enable publishing."
