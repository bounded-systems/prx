name: release

# Publishing pipeline for the public per-module split. Separate from ci.yml on
# purpose: CI stays the hard merge gate; this only publishes already-merged,
# already-green commits.
#
# Flow (changesets → JSR):
#   PR with a changeset merges to main -> version.yml opens the "Version
#   Packages" PR -> merging THAT PR bumps versions on main -> this runs ->
#   `jsr:publish` publishes any @bounded-systems/* package whose version is not
#   yet on JSR, in dependency order. Idempotent: nothing new to publish is a
#   no-op, so this is green on every push to main.
#
# Auth is tokenless OIDC (id-token: write) — no secret. Each package must already
# exist + be linked to bounded-systems/prx on JSR (run `nix run .#jsr-sync`).
# Single-package / out-of-band publishes go through publish-jsr.yml instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # tokenless JSR publish (OIDC)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish changed packages to JSR
        run: bun run jsr:publish
