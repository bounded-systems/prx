name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # Lets docs-regen.yml dispatch ci against its bot branch. A branch pushed
  # with GITHUB_TOKEN never fires push/pull_request runs (GitHub's anti-
  # recursion rule), but workflow_dispatch is the documented exception — so
  # the docs-regen PR can still get its required `ci` check. See docs-regen.yml.
  workflow_dispatch:

# Cancel superseded runs on the same PR (a new push kills the stale run — the
# largest Actions-minute leak on a private repo). Scoped to pull_request only:
# never cancel a push:main run, which validates main post-merge (the merge
# queue was removed, so push:main is the post-merge safety net).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: ci only reads the repo to run tests
# (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung step otherwise burns Actions minutes up to the 6-hour default.
    timeout-minutes: 20

    # GH-352: opt-in remote signing. When the `PRX_PROVENANCE_KEY` secret is set
    # (e.g. `ed25519:<b64>`), each `prx ci` phase below signs a `ci/phase/v1`
    # derivation into `PRX_CI_LEDGER`; the "Upload signed CI provenance" step
    # then publishes that ledger as the chain's *async mirror* (consumers verify
    # it out of band — the run never blocks on a durable-chain write).
    #
    # `PRX_CI_LEDGER` is set ONLY when the secret is present. `prx ci` is
    # fail-closed: a ledger in scope with no key is a hard error. So pointing it
    # at a ledger without the secret would red the job — instead, no secret ⇒ no
    # `PRX_CI_LEDGER` ⇒ no signing context ⇒ `prx ci` runs the checks unchanged.
    # Add the secret to switch remote signing (and its fail-closed guard) on.
    env:
      PRX_PROVENANCE_KEY: ${{ secrets.PRX_PROVENANCE_KEY }}
      PRX_CI_LEDGER: ${{ secrets.PRX_PROVENANCE_KEY != '' && format('{0}/.prx/ci-provenance.sqlite', github.workspace) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # JSR reads the publish version from jsr.json, but changesets only bumps
      # package.json — so guard that they stay in lockstep (drift would publish a
      # stale version). `bun run version-packages` keeps them synced on release;
      # this fails the PR if a hand-edit reintroduces drift.
      - name: jsr.json versions in sync with package.json
        run: bun run jsr:versions:check

      # GH-1039: every *direct* dependency must be pinned to an exact version, so
      # a version change is something a reviewer approves rather than something a
      # resolver does. A float that genuinely cannot be pinned lives in
      # `.dep-pins-allowlist.json` with a written reason, and that list can only
      # shrink. Placed before the build: a float is a cheap, unambiguous failure
      # and there is no point compiling a binary to discover it.
      - name: Direct dependencies pinned exactly
        run: bun run deps:pins:check

      - name: Build prx binary
        run: mkdir -p dist && bun packages/prx/scripts/prx-compile.ts dist/prx

      - name: prx ci (typecheck)
        run: dist/prx ci --phase=typecheck

      - name: prx ci (docs)
        run: dist/prx ci --phase=docs

      - name: prx ci (test)
        run: dist/prx ci --phase=test

      # GH-352: publish the signed CI provenance ledger as the chain's async
      # mirror. `if: always()` so a partial run still uploads the phases that
      # passed before a failure (the `prx ci` partial-pass attestation). Guarded
      # on the file existing — absent the signing secret it is never written, so
      # this is a no-op (no signer ⇒ no ledger ⇒ nothing to upload).
      - name: Upload signed CI provenance (async mirror)
        if: ${{ always() && hashFiles('.prx/ci-provenance.sqlite') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-provenance
          path: .prx/ci-provenance.sqlite
          if-no-files-found: ignore
          retention-days: 14
