name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # Lets docs-regen.yml dispatch ci against its bot branch. A branch pushed
  # with GITHUB_TOKEN never fires push/pull_request runs (GitHub's anti-
  # recursion rule), but workflow_dispatch is the documented exception — so
  # the docs-regen PR can still get its required `ci` check. See docs-regen.yml.
  workflow_dispatch:

# Cancel superseded runs on the same PR (a new push kills the stale run — the
# largest Actions-minute leak on a private repo). Scoped to pull_request only:
# never cancel a push:main run, which validates main post-merge (the merge
# queue was removed, so push:main is the post-merge safety net).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: ci only reads the repo to run tests
# (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung step otherwise burns Actions minutes up to the 6-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build prx binary
        run: mkdir -p dist && bun packages/prx/scripts/prx-compile.ts dist/prx

      - name: prx ci (typecheck)
        run: dist/prx ci --phase=typecheck

      - name: prx ci (docs)
        run: dist/prx ci --phase=docs

      - name: prx ci (test)
        run: dist/prx ci --phase=test
