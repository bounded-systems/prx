name: Dependency Review

# Block PRs that introduce vulnerable or disallowed-license dependencies.
# Complements the scheduled scanners (osv-scanner, scorecard, CodeQL default
# setup) by gating dependency changes at PR time.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
