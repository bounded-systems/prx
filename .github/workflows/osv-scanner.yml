name: osv-scanner

# OSV-Scanner — dependency vulnerability scan against osv.dev. Complements the
# rest of the supply-chain posture: Dependabot bumps versions, CodeQL scans
# code patterns, SBOM/provenance attest the build — OSV adds *known-CVE*
# detection over the resolved `bun.lock`. Report-only and non-blocking for now
# (modeled on scorecard.yml): the SARIF→code-scanning upload is gated behind
# GitHub Advanced Security, so results are also kept as an artifact.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF upload to code scanning (gated below)
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        # Non-blocking: a found vulnerability must not fail the build yet — this
        # is a surfacing tool, not a gate. Promote to a gate later by dropping
        # continue-on-error once the baseline is clean.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --lockfile=bun.lock

      - name: Upload SARIF to code scanning
        # Disabled to match scorecard.yml. CodeQL default setup already uploads
        # SARIF on this repo, so Advanced Security code scanning is active —
        # flip this to `if: always()` to surface OSV findings in the Security
        # tab alongside CodeQL.
        if: false
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-results
          path: results.sarif
          retention-days: 5
