name: version

# Automated changelog / version PR. Complements release.yml (which only
# PUBLISHES already-merged, already-versioned commits). The loop:
#
#   PR with a .changeset/*.md merges to main
#     -> this workflow runs `changeset version` (consumes the changesets, bumps
#        versions, regenerates each CHANGELOG.md)
#     -> opens/updates a single "chore(release): version packages" PR
#     -> merging THAT PR lands the changelog + version bumps, and release.yml
#        publishes.
#
# No third-party action (same rule as release.yml): every step is SHA-pinnable,
# the PR is opened with the preinstalled `gh` + the built-in GITHUB_TOKEN.
# NOTE: requires "Allow GitHub Actions to create and approve pull requests" in
# the repo's Actions settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release branch
      pull-requests: write # open/update the release PR
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume changesets (version + changelog)
        id: version
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -n1)"
          if [ -z "$pending" ]; then
            echo "::notice::no pending changesets — nothing to version"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun run version-packages
          if git diff --quiet; then
            echo "::notice::version produced no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the release PR
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="changeset-release/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(release): version packages"
          git push -f origin "$branch"
          if gh pr view "$branch" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "::notice::release PR already open — branch updated"
          else
            gh pr create \
              --base main --head "$branch" \
              --title "chore(release): version packages" \
              --body "Automated by \`.github/workflows/version.yml\`: consumes \`.changeset/*.md\`, bumps versions, and regenerates each \`CHANGELOG.md\`. Merge to cut the release (release.yml then publishes)."
          fi
