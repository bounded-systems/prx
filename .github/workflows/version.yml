name: version

# Automated changelog / version PR. Complements release.yml (which only
# PUBLISHES already-merged, already-versioned commits). The loop:
#
#   PR with a .changeset/*.md merges to main
#     -> this workflow runs `changeset version` (consumes the changesets, bumps
#        versions, regenerates each CHANGELOG.md)
#     -> opens/updates a single "chore(release): version packages" PR
#     -> merging THAT PR lands the changelog + version bumps, and release.yml
#        publishes.
#
# Auth: if the prx-forge bucket app is configured (repo var PRX_FORGE_APP_ID +
# secret PRX_FORGE_APP_PRIVATE_KEY) this mints a short-lived App token and uses it to
# push the branch and open the PR — so "Allow GitHub Actions to create and
# approve pull requests" can stay OFF (least privilege, prx-m1hs), and the PR
# (created by the App, not GITHUB_TOKEN) actually triggers ci/coverage/etc.
# Falls back to the built-in GITHUB_TOKEN when no App is configured (which then
# DOES require that Actions setting enabled). Only actions/* (GitHub-owned),
# SHA-pinned — same supply-chain rule as release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release branch
      pull-requests: write # open/update the release PR
      id-token: write # OIDC -> broker /github/forge-version
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Broker mint (cf-token-broker /github/forge-version): OIDC in, short-lived
      # installation token out. The entry is capability-named and pinned to THIS
      # workflow on main; the App behind it (bs-door-forge) can be swapped
      # registry-side without touching this file. Replaces the
      # create-github-app-token mint from the PRX_FORGE_APP_PRIVATE_KEY repo
      # secret — no PEM in this repo. Same fallback contract as before: when the
      # broker URL is not configured, downstream steps use GITHUB_TOKEN.
      - name: Mint forge token (broker /github/forge-version)
        id: app-token
        if: ${{ vars.CF_BROKER_URL != '' }}
        env:
          CF_BROKER_URL: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          jwt="$(curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-app-broker"             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::no OIDC token for github-app-broker"; exit 1; }
          body="$(curl -sf -X POST "${CF_BROKER_URL%/}/github/forge-version" -H "Authorization: Bearer $jwt")" || {
            echo "::error::broker refused the forge-version mint (401 = pin rejected, 404 = entry not deployed)"; exit 1; }
          tok="$(jq -r '.token // empty' <<<"$body")"
          [ -n "$tok" ] || { echo "::error::broker returned no token"; exit 1; }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # App token (if configured) so the branch push is attributed to the App
          # and the resulting PR triggers downstream workflows; else GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume changesets (version + changelog)
        id: version
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -n1)"
          if [ -z "$pending" ]; then
            echo "::notice::no pending changesets — nothing to version"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun run version-packages
          if git diff --quiet; then
            echo "::notice::version produced no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the release PR
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="changeset-release/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(release): version packages"
          git push -f origin "$branch"
          if gh pr view "$branch" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "::notice::release PR already open — branch updated"
          else
            gh pr create \
              --base main --head "$branch" \
              --title "chore(release): version packages" \
              --body "Automated by \`.github/workflows/version.yml\`: consumes \`.changeset/*.md\`, bumps versions, and regenerates each \`CHANGELOG.md\`. Merge to cut the release (release.yml then publishes)."
          fi
