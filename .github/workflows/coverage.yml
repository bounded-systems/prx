name: coverage

# Report-only code coverage. Runs the test suite with Bun's native coverage,
# parses the lcov report into the workflow summary, and uploads it as an
# artifact. It never gates merges — the `ci` workflow is what enforces tests.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: read the repo, plus write coverage to GitHub Code Quality.
# `code-quality: write` is the fine-grained scope the upload action needs
# (Code coverage in PRs, public preview). Harmless where the feature is
# unavailable — the upload step is report-only and won't fail the job.
permissions:
  contents: read
  code-quality: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    # A hung step otherwise burns Actions minutes up to the 6-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the binary so the tests that spawn `dist/prx` are exercised,
      # keeping the coverage number representative of the real suite.
      - name: Build prx binary
        run: mkdir -p dist && bun packages/prx/scripts/prx-compile.ts dist/prx

      # Report-only: do not fail the job on test failures or low coverage.
      - name: Run tests with coverage
        continue-on-error: true
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: Coverage summary
        if: always()
        run: bun run packages/prx/scripts/coverage-summary.ts coverage/lcov.info

      # GitHub Code Quality wants Cobertura XML; Bun only emits lcov.
      - name: Convert lcov to Cobertura
        if: always()
        run: bun run packages/prx/scripts/lcov-to-cobertura.ts coverage/lcov.info coverage/cobertura.xml

      # Surface coverage inline on PRs via GitHub Code Quality (public preview).
      # Report-only: never fails the job — lights up wherever the feature is
      # enabled for the repo, and no-ops harmlessly where it isn't.
      - name: Upload coverage to GitHub Code Quality
        if: always()
        continue-on-error: true
        uses: actions/upload-code-coverage@abb5995db9e0199b0e2bb9dbd136fce4cb1ec4d3 # v1
        with:
          file: coverage/cobertura.xml
          language: typescript
          label: unit
          fail-on-error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
