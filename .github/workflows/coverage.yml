name: coverage

# Code coverage with two gates. Runs the test suite with Bun's native coverage,
# parses the lcov report into the workflow summary, uploads it as an artifact,
# and FAILS the job (a required check) on a breach of either:
#   • global  — project-total line coverage below 85% (`--min 85`)
#   • per-file — any `src/` file below 80% that isn't in PER_FILE_BASELINE, or a
#                stale baseline entry (`--per-file-min 80`, a shrink-only ratchet)
# The test run itself stays `continue-on-error` so the `ci` workflow remains the
# authority on test pass/fail; this job is the authority on the coverage floor.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: read the repo, plus write coverage to GitHub Code Quality.
# `code-quality: write` is the fine-grained scope the upload action needs
# (Code coverage in PRs, public preview). Harmless where the feature is
# unavailable — the upload step is report-only and won't fail the job.
permissions:
  contents: read
  code-quality: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    # A hung step otherwise burns Actions minutes up to the 6-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the binary so the tests that spawn `dist/prx` are exercised,
      # keeping the coverage number representative of the real suite.
      - name: Build prx binary
        run: mkdir -p dist && bun packages/prx/scripts/prx-compile.ts dist/prx

      # Report-only: do not fail the job on test failures or low coverage.
      # Only the lcov reporter — NOT text. GH-664: the `text` reporter printing a
      # 600+-file table to stdout aborts mid-write in CI with
      # `error: An internal error occurred (WriteFailed)`, killing the run before
      # the lcov file is written (so `coverage/lcov.info` never appears). The
      # human-readable summary is produced from lcov by coverage-summary.ts below,
      # so the text reporter is redundant anyway.
      - name: Run tests with coverage
        continue-on-error: true
        run: bun test --coverage --coverage-reporter=lcov

      # Coverage gates (coverage-summary.ts exits non-zero on a breach, failing
      # this job — which is a required status check, so it blocks merges):
      #   --min 85          global project line-coverage floor
      #   --per-file-min 85 per-file ratchet: every src/ file ≥ 85% unless it's
      #                     in PER_FILE_BASELINE (which may only shrink)
      - name: Coverage summary + gates (global 85% / per-file 85%)
        if: always()
        run: bun run packages/prx/scripts/coverage-summary.ts coverage/lcov.info --min 85 --per-file-min 85

      # GitHub Code Quality wants Cobertura XML; Bun only emits lcov.
      - name: Convert lcov to Cobertura
        if: always()
        run: bun run packages/prx/scripts/lcov-to-cobertura.ts coverage/lcov.info coverage/cobertura.xml

      # Surface coverage inline on PRs via GitHub Code Quality (public preview).
      # Report-only: never fails the job — lights up wherever the feature is
      # enabled for the repo, and no-ops harmlessly where it isn't.
      - name: Upload coverage to GitHub Code Quality
        if: always()
        continue-on-error: true
        uses: actions/upload-code-coverage@a72ab75b4dee0e479386fb9bf33c8dcf64b9c772 # v1
        with:
          file: coverage/cobertura.xml
          language: typescript
          label: unit
          fail-on-error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
