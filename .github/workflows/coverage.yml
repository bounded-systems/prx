name: coverage

# Report-only code coverage. Runs the test suite with Bun's native coverage,
# parses the lcov report into the workflow summary, and uploads it as an
# artifact. It never gates merges — the `ci` workflow is what enforces tests.
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: coverage only reads the repo and writes the run summary.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the binary so the tests that spawn `dist/prx` are exercised,
      # keeping the coverage number representative of the real suite.
      - name: Build prx binary
        run: mkdir -p dist && bun packages/prx/scripts/prx-compile.ts dist/prx

      # Report-only: do not fail the job on test failures or low coverage.
      - name: Run tests with coverage
        continue-on-error: true
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: Coverage summary
        if: always()
        run: bun run packages/prx/scripts/coverage-summary.ts coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/
          if-no-files-found: warn
