name: publish-jsr

# Publish @bounded-systems/cas to JSR (https://jsr.io) via tokenless OIDC.
# JSR exchanges the GitHub OIDC token (id-token: write) for publish rights,
# verified against the package's linked GitHub repo — no token or secret.
#
# Prerequisites (one-time, on jsr.io): create the @bounded-systems scope, create
# the `cas` package, and link it to `bounded-systems/prx`. Until then this is a
# manual-only workflow (workflow_dispatch); the tag trigger picks up the
# changesets release tags once publishing is live.
#
# JSR publishes the TypeScript source directly (no dist build). If publish fails
# on "slow types", either add explicit annotations to cas's public API or pass
# `--allow-slow-types` to the publish step.

on:
  workflow_dispatch:
  push:
    tags:
      - "@bounded-systems/cas@*"

permissions:
  contents: read
  id-token: write # tokenless JSR publish (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to JSR
        working-directory: packages/cas
        run: bunx jsr publish
