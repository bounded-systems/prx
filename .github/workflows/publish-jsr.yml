name: publish-jsr

# Publish a @bounded-systems/* package to JSR (https://jsr.io) via tokenless
# OIDC. JSR exchanges the GitHub OIDC token (id-token: write) for publish
# rights, verified against the package's linked GitHub repo — no token or secret.
#
# One tag → one package (preserves the cas → anchored-chain → scout dependency
# order; publish each package by pushing its own release tag). The package to
# publish is derived from the tag `@bounded-systems/<pkg>@<version>`, or passed
# explicitly via workflow_dispatch.
#
# Prerequisites (one-time, on jsr.io): the @bounded-systems scope exists, and the
# package is created + linked to `bounded-systems/prx` (run `nix run .#jsr-sync`
# / `bun packages/prx/scripts/jsr-sync.ts` to reserve + link all packages).
#
# JSR publishes the TypeScript source directly (no dist build). If publish fails
# on "slow types", either add explicit annotations to the package's public API or
# pass `--allow-slow-types` to the publish step.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under packages/ to publish (e.g. cas)"
        required: true
        default: cas
  push:
    tags:
      - "@bounded-systems/*@*"

permissions:
  contents: read
  id-token: write # tokenless JSR publish (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve package
        id: pkg
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pkg="$INPUT_PACKAGE"
          else
            # tag = @bounded-systems/<pkg>@<version>
            pkg="${REF_NAME#@bounded-systems/}"   # <pkg>@<version>
            pkg="${pkg%@*}"                        # <pkg>
          fi
          if [ -z "$pkg" ]; then
            echo "::error::could not determine package to publish (event=$EVENT ref=$REF_NAME)"
            exit 1
          fi
          dir="packages/$pkg"
          if [ ! -f "$dir/jsr.json" ]; then
            echo "::error::$dir/jsr.json not found — '$pkg' is not a JSR-publishable package"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing @bounded-systems/$pkg from $dir"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to JSR
        working-directory: ${{ steps.pkg.outputs.dir }}
        # --allow-slow-types for parity with release.yml (jsr:publish): a package
        # without explicit public-API types still publishes (lower JSR score, not
        # a hard block).
        run: bunx jsr publish --allow-slow-types
