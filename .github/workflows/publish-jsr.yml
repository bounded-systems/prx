name: publish-jsr

# Publish a @bounded-systems/* package to JSR (https://jsr.io) via tokenless OIDC.
# JSR exchanges the GitHub OIDC token (id-token: write) for publish rights,
# verified against the package's linked GitHub repo — no token or secret.
#
# Two ways in:
#   - workflow_dispatch with `package` = the directory under packages/ (e.g. cas).
#   - a push of a changesets tag `@bounded-systems/<pkg>@<version>`.
# The package directory name matches the JSR package name across this repo.
#
# Prerequisite per package (one-time, on jsr.io): the package must exist and be
# linked to bounded-systems/prx — `bun run jsr:manifest && jsr-sync` does that.
# JSR publishes the TS source directly; on "slow types" either annotate the
# public API or add `--allow-slow-types`.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under packages/ to publish (e.g. cas, anchored-chain)"
        required: true
        default: cas
  push:
    tags:
      - "@bounded-systems/*@*"

permissions:
  contents: read
  id-token: write # tokenless JSR publish (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve package directory
        id: pkg
        # Inputs via env (never interpolated into the script) + strict validation,
        # so an untrusted ref/input can't inject shell or escape packages/.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PKG: ${{ inputs.package }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            dir="$INPUT_PKG"
          else
            name="${REF_NAME#@bounded-systems/}" # @bounded-systems/<pkg>@<ver> -> <pkg>@<ver>
            dir="${name%@*}"                      # -> <pkg>
          fi
          case "$dir" in
            "" | *[!a-z0-9-]*) echo "::error::invalid package dir '$dir'"; exit 1 ;;
          esac
          if [ ! -f "packages/$dir/jsr.json" ]; then
            echo "::error::packages/$dir/jsr.json not found"; exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing packages/$dir"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to JSR
        working-directory: packages/${{ steps.pkg.outputs.dir }}
        run: bunx jsr publish
