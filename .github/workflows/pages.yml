name: pages

# Publish the docs site to GitHub Pages. `bun run site:build` projects the doc
# catalog + prx.jsonld + the JSON Schema artifacts into _site/; this deploys it.
#
# harden-runner / checkout / setup-bun are SHA-pinned (shared with release.yml).
# The actions/*-pages actions are version-pinned for now — pin to SHAs once a
# resolver is available (TODO), to match the repo's SHA-pinning convention.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site:build

      - name: Configure Pages
        uses: actions/configure-pages@v6 # TODO: pin to SHA

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5 # TODO: pin to SHA
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC verification of the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # TODO: pin to SHA
