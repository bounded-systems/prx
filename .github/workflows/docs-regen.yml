name: docs-regen

# Keep the GENERATED docs in sync with main. Several docs are projections of
# code that main changes constantly — most notably docs/cli.md (the command
# registry) — so a feature PR cannot keep them current against the pull_request
# merge tree without treadmilling. Hence those docs are NOT hard-gated; this
# workflow owns them instead:
#
#   push to main
#     -> `bun run docs:render` regenerates every generated doc
#     -> if anything drifted, open/update a single "docs: regenerate" PR
#     -> merging it lands the refreshed docs.
#
# No third-party action (same rule as version.yml / release.yml): every step is
# SHA-pinnable; the PR is opened with the preinstalled `gh` + GITHUB_TOKEN.
# NOTE: requires "Allow GitHub Actions to create and approve pull requests" in
# the repo's Actions settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the docs-regen branch
      pull-requests: write # open/update the docs PR
      actions: write # dispatch ci against the bot branch (see below)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate docs
        id: regen
        run: |
          bun run docs:render
          if git diff --quiet; then
            echo "::notice::generated docs already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "drifted files:"
            git diff --name-only
          fi

      - name: Open or update the docs-regen PR
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="docs-regen/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "docs: regenerate from main"
          git push -f origin "$branch"
          if gh pr view "$branch" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "::notice::docs-regen PR already open — branch updated"
          else
            gh pr create \
              --base main --head "$branch" \
              --title "docs: regenerate generated docs from main" \
              --body "Automated by \`.github/workflows/docs-regen.yml\`: runs \`bun run docs:render\` on main and opens this PR when a generated doc (e.g. \`docs/cli.md\`, projected from the command registry) drifts. Merge to refresh."
          fi

          # This branch was just pushed with GITHUB_TOKEN, so GitHub will NOT
          # fire ci.yml's push/pull_request runs (anti-recursion). The main
          # ruleset requires the `ci` check, so without this the PR would sit
          # BLOCKED forever and never auto-merge. workflow_dispatch is the
          # documented exception that DOES run from GITHUB_TOKEN — dispatch ci
          # against the branch head to produce the required check, then arm
          # auto-merge so the refreshed docs land hands-free once it's green.
          gh workflow run ci.yml --ref "$branch"
          # Arm auto-merge, but only if not already set: on the PR-update path
          # auto-merge persists from the first run, and re-enabling it can exit
          # non-zero — under `set -e` that would fail every later docs-regen run.
          if [ "$(gh pr view "$branch" --json autoMergeRequest --jq '.autoMergeRequest != null')" != "true" ]; then
            gh pr merge "$branch" --auto --squash
          fi
